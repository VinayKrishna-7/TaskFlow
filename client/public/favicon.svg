<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="50%" stop-color="#A31D33" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Vivid Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Iconic TaskFlow Stack -->
  <g filter="url(#glow)" stroke="url(#layerGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Layer -->
    <path d="M32 15L50 24L32 33L14 24Z" fill="#FFFFFF" fill-opacity="0.25" />
    
    <!-- Middle Layer -->
    <path d="M14 33L32 42L50 33" />
    
    <!-- Bottom Layer -->
    <path d="M14 42L32 51L50 42" />
  </g>
</svg>