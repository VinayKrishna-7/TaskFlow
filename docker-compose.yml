version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: taskflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: taskflow-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskflow
      - JWT_ACCESS_SECRET=taskflow_production_jwt_access_secret_2026!
      - JWT_REFRESH_SECRET=taskflow_production_jwt_refresh_secret_2026!
      - CLIENT_URL=http://localhost
      - UPLOAD_DIR=uploads
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - server-uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: taskflow-client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  mongo-data:
  server-uploads: